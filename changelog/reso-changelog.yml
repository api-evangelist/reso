- version: v0.11
  name: Elevenses
  component: reso-tools
  date: '2026-04-24'
  date_note: GitHub pre-release tag "packaging-test" dated 2026-04-24; the release-notes page lists v0.11 without a date.
  breaking: false
  highlights:
  - Saved Configs and Connection Manager - separate SavedCredentials and SavedCertConfig models, OS-keychain storage via safeStorage, import/export with collision detection.
  - SQLite job store replaces localStorage job persistence in the Electron main process (jobs + job_steps tables, 19 unit tests).
  - Variations Review - collaborative review workflow wired to services.reso.org/v2/certification/variations/*, with locking, inline comments and Fast Track gating.
  - 'Cert API auth scheme corrected: Basic auth for admin accounts, ApiKey auth for provider accounts.'
