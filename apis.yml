- aid: reso:reso-cloud-mcp
  name: RESO Cloud MCP Server
  description: >-
    The RESO Cloud MCP Server is the one production API endpoint RESO itself operates. It speaks the
    Model Context Protocol over Streamable HTTP at https://services.reso.org/mcp and exposes the
    RESO toolchain to AI agents - authenticate, query, metadata, create, update, delete and
    parse-filter - so an agent can work against any RESO-certified OData server without knowing
    OData syntax. It is a broker, not a data source: every tool call takes a target server URL and
    that server's credentials, and RESO stores no listing data behind it. Access is beta and gated
    on an API key issued by RESO on request to dev@reso.org, available to RESO members and
    conference attendees; an anonymous tools/list returns HTTP 401 with a JSON-RPC error pointing at
    that address. The same tool interfaces are available offline via the local stdio server
    (@reso-standards/reso-mcp-server), which adds the validate, run-compliance and metadata-report
    certification tools.
  humanURL: https://tools.reso.org/packages/reso-mcp-server
  baseURL: https://services.reso.org/mcp
  tags:
  - MCP
  - AI Agents
  - OData
  - Certification
  - Tooling
  properties:
