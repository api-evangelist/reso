apis:
- aid: reso:reso-web-api
  name: RESO Web API
  description: >-
    The RESO Web API is the ratified transport standard for real estate data, defined as a
    profile of OData 4.0/4.01 (Web API Core 2.0.0 and 2.1.0). Servers MUST expose an OData
    XML metadata document at /$metadata relative to their service root, MUST return JSON for
    data requests, MUST use TLS 1.2 or above, and MUST authenticate with OAuth2 Bearer tokens
    or the Client Credentials grant (RCP-026). RESO publishes the specification, the reference
    Data Dictionary EDMX metadata and the RESO Commander testing tool, but RESO operates NO
    endpoint of its own and no base URL is documented here for that reason - every conformant
    server is run by an individual MLS or data provider. Access is not self-serve: RESO states
    that "access to data from the Web API is gained through local MLSs" and that "RESO does
    not provide MLS real estate data. RESO creates data standards." The api.reso.org host that
    appears in the specification text is an illustrative example only and does not resolve.
  humanURL: https://www.reso.org/reso-web-api/
  tags:
  - Web API
  - OData
  - MLS
  - Transport
  - Certification
