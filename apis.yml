aid: reso
url: https://raw.githubusercontent.com/api-evangelist/reso/refs/heads/main/apis.yml
name: RESO (Real Estate Standards Organization)
kind: company
description: >-
  RESO, the Real Estate Standards Organization, is the United States industry body that
  writes and certifies the machine-readable contract for residential real estate data. It
  publishes the RESO Data Dictionary (the field, enumeration and lookup vocabulary) and the
  RESO Web API (an OData 4.0/4.01 profile, Web API Core 2.0.0 ratified Jan 2021 and 2.1.0
  ratified Dec 2023), plus the RESO Common Format, EntityEvent replication, Push Replication
  with Webhooks, Validation Expressions and the URN-based Universal Parcel Identifier (UPI).
  NAR Policy Statement 7.90 requires MLSs owned and operated by associations of REALTORS to
  implement the Data Dictionary and the Web API and to adopt new releases within one year of
  ratification, which makes this the only mandated machine-readable API contract in the API
  Evangelist sector study that is imposed by an industry body rather than a regulator. RESO
  itself operates no production API and holds no listing data: it certifies other people's
  servers. Its specifications, reference OData EDMX metadata and Data Dictionary JSON are
  freely and anonymously downloadable from transport.reso.org and the RESOStandards GitHub
  organization (a EULA click-through wraps the reso.org copies), and the certification
  directory at reso.org/certificates and certification.reso.org is public without login.
  Reachability is the separate fact: a RESO-certified endpoint is run by a local MLS, and
  credentials for it are issued only after a data licence with that MLS is signed, so
  certification here means conformance, never public access.
image: https://www.reso.org/wp-content/uploads/2021/04/RESO-Logo-Fullname_Horizontal_Blue.png
tags:
- Real Estate
- United States
- RESO
