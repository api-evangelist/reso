sources:
  - url: https://www.reso.org/reso-web-api/
    type: Documentation
    note: Source of the "access is gained through local MLSs" and "RESO does not provide MLS real estate data" statements.
  - url: https://www.reso.org/certification/
    type: Certification
    note: Names the three certifiable standards and the complimentary-for-members cost model.
  - url: https://www.reso.org/specs/
    type: Specification
    note: Specification directory listing Web API Core 2.0.0, Data Dictionary 1.7/2.0/2.1 and the reference metadata.
  - url: https://transport.reso.org/
    type: Specification
    note: Ratified endorsements with versions, publicly readable, no login.
  - url: https://github.com/RESOStandards/transport
    type: SourceCode
    note: Canonical home of every specification and of the EDMX/JSON reference artifacts harvested here.
  - url: https://www.reso.org/membership/
    type: Membership
    note: Membership classes A-F and published dues ranges.
  - url: https://www.nar.realtor/handbook-on-multiple-listing-policy/operational-issues-section-12-real-estate-transaction-standards-rets-policy-statement-790
    type: Regulation
    note: NAR Policy Statement 7.90, the mandate behind RESO adoption.

conclusion: >-
  RESO is the cleanest example in the study of a mandated machine-readable contract that is also
  completely unreachable as data. The contract is free, versioned, OData-based, git-hosted and
  anonymously downloadable; the certification directory is public; and none of that gets a
  developer a single listing. Two facts, held apart: RESO certification is real and enforced by
  NAR for association-owned MLSs, and access to the data behind any certified endpoint requires a
  signed licence with one of roughly 500 individual MLSs. RESO operates no API, issues no keys,
  and stores no listings.
