note: >-
  RESO's lifecycle is a STANDARDS lifecycle, not a service lifecycle. There is no uptime SLA and no
  status page because RESO runs no production data service; what it publishes instead is an
  explicit, dated versioning policy, a ratification process, a deprecation model and an expiring
  certification. That policy is unusually well documented for this catalog.
versioning:
  scheme: semver
  docs: https://transport.reso.org/versioning/
  rules:
  - MAJOR when making incompatible API changes
  - MINOR when adding functionality in a backward compatible manner
  - PATCH when making backward compatible bug fixes
  practice: >-
    Data Dictionary uses major and minor only in public form (1.7, 2.0, 2.1); patch-level changes are
    tracked internally. Transport specifications include the patch level (Web API Core 2.0.0) but
    only major and minor are used in practice.
  negotiation:
  - {condition: Older version not supported, response: HTTP 400 Bad Request}
  - {condition: Newer version than the server supports, response: HTTP 400 Bad Request}
