ratification_process:
  docs: https://transport.reso.org/reso-rcp-process
  stages:
  - {step: 1, name: Proposal, detail: Submitted via GitHub Discussions with a business case and requirements.}
  - {step: 2, name: Draft & Review, detail: 'Transport Workgroup reviews the draft specification and testing rules. At least two vendor implementations are required.'}
  - {step: 3, name: Approval, detail: Approved by the Transport Workgroup and Certification once implementations are verified; testing tools are built.}
  - {step: 4, name: Ratification, detail: 'Major versions require ratification by the RESO Board of Directors. Minor versions may be approved by the Transport Workgroup without Board ratification.'}
deprecation:
  policy_url: https://transport.reso.org/versioning/
  policy_changes_url: https://transport.reso.org/policy-changes/
  sunset_header: false
  model: >-
    Deprecation is expressed through the specification and the certification test suite, not through
    HTTP headers. Removing something from a RESO specification means RESO stops testing for it in
    certification; providers may keep serving it unless expressly forbidden (for example a
    disallowed synonym), so deprecation from the standard is not removal from the API.
  breaking_change_definition:
  - A standard field has a type change.
  - A disallowed synonym is added for a resource, field or lookup.
  - An existing enumerated field is closed, or items are removed from an existing closed enumeration.
  - Duplicate or replacement data elements are added.
  - New testing rules are added to existing data elements, including Fast Track mappings.
  breaking_changes_require: Ratification of a MAJOR version by the RESO Board of Directors.
  active_deprecation_notices:
  - target: OData Edm.EnumType lookups
    status: deprecating
    replacement: Edm.String lookups via the Lookup Resource (RCP-032)
    reason: >-
      Edm.EnumType usually requires knowledge of vendor-specific namespaces and does not allow
      human-friendly lookup names.
    source: https://transport.reso.org/proposals/web-api-core
  - target: Edm.EnumType with IsFlags=true (multi-value lookups)
    status: deprecating
    replacement: Collection(Edm.String) with the Lookup Resource
    reason: Strictly following OData limits IsFlags to 64 total values.
    source: https://transport.reso.org/proposals/web-api-core
  - target: RESO Commander (web-api-commander, Java)
    status: to-be-deprecated
    replacement: The RESO SDK (@reso-standards/* TypeScript packages)
    source: https://github.com/RESOStandards/web-api-commander
  - target: OpenID Connect support in the Web API
    status: removed
    removed_in: Web API 1.0.2
    replacement: OAuth2 Bearer tokens and Client Credentials only
    source: https://transport.reso.org/proposals/web-api-core
  - target: RETS (Real Estate Transaction Standard)
    status: legacy
    replacement: RESO Web API
    note: RESO still hosts RETS support pages for legacy implementers.
certification_lifecycle:
  effective: '2025-12'
  approved_by: RESO Board of Directors
  source: https://transport.reso.org/policy-changes/
  rules:
  - RESO endorsements will expire after two years.
  - RESO will always certify on the latest minor version in a given major branch.
  - New testing rules on existing data elements are a MAJOR change; on new data elements, MINOR.
  - Fast Track suggestions will only be required in the next major version; providers get warnings first.
  - The RESO SDK version will be added to endorsements.
  - Data Dictionary and Transport Workgroups may approve MINOR Data Dictionary versions without Board ratification, and no breaking changes may be introduced in a minor version.
adoption_mandate:
  body: National Association of REALTORS (NAR)
  instrument: Handbook on Multiple Listing Policy, Policy Statement 7.90
  url: https://www.nar.realtor/handbook-on-multiple-listing-policy/operational-issues-section-12-real-estate-transaction-standards-rets-policy-statement-790
  rule: >-
    MLS organizations owned and operated by associations of REALTORS "will keep current by
    implementing new releases of RESO Standards within one (1) year from ratification."
  effect: >-
    A ratification date is therefore also a compliance clock for several hundred MLSs - the tightest
    adoption cadence of any standard in this catalog.
