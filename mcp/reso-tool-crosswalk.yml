note: >-
  RESO publishes no OpenAPI. Its machine-readable contract is OData 4.0/4.01 CSDL (the $metadata
  document harvested into openapi/) plus the ratified Web API Core (RCP-37) and Add/Edit (RCP-10)
  request grammars. This crosswalk therefore binds each MCP tool to the OData request form it
  issues rather than to an operationId, and names the Data Dictionary resources the request can
  target. Nothing here is invented: every tool name comes from the RESO MCP server documentation,
  and every OData request form is quoted from the ratified specification.
surfaces:
  openapi:
    present: false
    reason: RESO does not publish OpenAPI; probes of /openapi.json and /swagger.json return 404.
  odata:
    present: true
    contract: OData 4.0/4.01 CSDL (EDMX) at <service-root>/$metadata
    local_copies:
    - openapi/reso-dd-2.1-enum.xml
    - openapi/reso-dd-2.0-enum.xml
    - openapi/reso-dd-1.7-enum.xml
    note: >-
      Service roots are operated by individual MLSs, not by RESO. api.reso.org appears in the
      specification only as an illustrative example host and does not resolve.
  graphql:
    present: false
  mcp:
    present: true
    url: https://services.reso.org/mcp
    transport: streamable-http
    gated: true
    gate: API key issued by RESO (dev@reso.org); anonymous tools/list returns HTTP 401.
